name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  contract-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: test -f apps/api/openapi.yaml
      - run: test -f packages/shared-types/src/types.ts

  migration-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: test -f infra/migrations/0001_init.sql

  deploy-api:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build, contract-check, migration-check]
    # Deploys must serialize: two back-to-back merges once raced here and the
    # OLDER image won the last `az containerapp update` (2026-08-11, #138 vs
    # #139 — prod served stale routes until a manual rerun). Queued runs
    # collapse to the newest, which for a deploy is exactly right.
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: false
    env:
      # ── Match infra/azure-setup.sh (RESOURCE_GROUP="Cribliv", ACR_NAME="criblivacr", API_APP_NAME="cribliv-api") ──
      ACR_NAME: criblivacr
      APP_NAME: cribliv-api
      RESOURCE_GROUP: Cribliv
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image cribliv-api:${{ github.sha }} \
            .

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/cribliv-api:${{ github.sha }}
