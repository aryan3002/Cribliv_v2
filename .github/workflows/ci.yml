name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  contract-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: test -f apps/api/openapi.yaml
      - run: test -f packages/shared-types/src/types.ts

  migration-check:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - run: test -f infra/migrations/0001_init.sql

  deploy-api:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    needs: [build, contract-check, migration-check]
    # Deploys must serialize: two back-to-back merges once raced here and the
    # OLDER image won the last `az containerapp update` (2026-08-11, #138 vs
    # #139 — prod served stale routes until a manual rerun). Queued runs
    # collapse to the newest, which for a deploy is exactly right.
    concurrency:
      group: deploy-api-${{ github.ref }}
      cancel-in-progress: false
    env:
      # ── Match infra/azure-setup.sh (RESOURCE_GROUP="cribliv-prod", ACR_NAME="criblivprodacr", API_APP_NAME="cribliv-api") ──
      # Sponsored subscription 6b65d070-… since the Sept 2026 migration; the
      # AZURE_CREDENTIALS secret must be a service principal on that subscription.
      ACR_NAME: criblivprodacr
      APP_NAME: cribliv-api
      WORKER_APP_NAME: cribliv-worker
      RESOURCE_GROUP: cribliv-prod
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build and push image to ACR
        run: |
          az acr build \
            --registry ${{ env.ACR_NAME }} \
            --image cribliv-api:${{ github.sha }} \
            .

      - name: Deploy API to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/cribliv-api:${{ github.sha }}

      # The worker runs the SAME image with a `node dist/worker/worker.js`
      # command override (set on the app, preserved by --image updates). Until
      # 2026-09 this step didn't exist, so only the API was ever rolled: the
      # worker silently stayed on whatever image it was last given — 2 months
      # stale on the old subscription, running different code than the API
      # against the same database. Deploy both or they drift again.
      - name: Deploy worker to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.WORKER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/cribliv-api:${{ github.sha }}
